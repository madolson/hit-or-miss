<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hit or Miss · How it works</title>
<link rel="stylesheet" href="/app.css">
<style>
  main { max-width: 1240px; margin: 0 auto; padding: 1.5em; }
  .topbar { display: flex; align-items: center; gap: .8em; margin-bottom: 1em; }
  .topbar img { height: 2em; }
  .topbar h1 { margin: 0; }
  .cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(560px, 100%), 1fr)); gap: 1em; margin-top: 1.5em; }
  .topbar a { color: #9aa4d1; }
  @media (max-width: 600px) { main { padding: .8em; } .topbar h1 { font-size: 1.3em; } .case td:first-child { width: 55%; } }
  .case h2 { margin-bottom: .2em; }
  .case .who { color: #9aa4d1; margin: 0 0 .6em; }
  .case table { width: 100%; border-collapse: collapse; font-size: .92em; }
  .case td { padding: .35em .4em; border-top: 1px solid #2a3466; vertical-align: top; }
  .case td:first-child { width: 48%; }
  .case code { font: 12.5px/1.4 ui-monospace, Menlo, monospace; color: #ffcf5c; word-break: break-word; }
  </style>
</head>
<body>
<main>
  <header class="topbar"><img src="/valkey-logo.svg" alt=""><h1>Hit or Miss · How it works</h1><span style="flex:1"></span><a href="https://github.com/madolson/hit-or-miss">Code on GitHub</a></header>
  <p class="muted">Every piece of game state lives in ElastiCache for Valkey. Each card is one use case and the commands that implement it, the same commands that scroll by on the host screen.</p>
  <div class="cases" id="cases"></div>
</main>
<script>
const P = 'Player', H = 'Host', S = 'App servers';
const CASES = [
  { id: 'join', name: 'Join the game', actors: [P], how: 'POST /api/join. A cookie holds a random player id, so the same phone stays the same player across rounds and reloads. Every write is absolute, so joining twice is the same as joining once.', cmds: [
    ['MULTI', 'The writes below apply together. All game keys share the {game} hash tag, so they sit in one slot.'],
    ['HSET {game}:players <pid> <name>', 'Store the display name under the player id.'],
    ['ZADD {game}:leaderboard NX 0 <pid>', 'Put the player on the board at 0. NX never resets an existing score.'],
    ['HLEN {game}:players · EXEC', 'Player count for the host screen.'],
    ['XADD {game}:events MAXLEN ~ 1000 * type players count <n>', 'Tell every server, each of which pushes the new count to its screens.'],
  ] },
  { id: 'answer', name: 'Lock in an answer', actors: [P], how: 'POST /api/answer. The first answer wins, enforced by Valkey. Points are not worked out here, so nothing on the command stream gives away who was right before the reveal.', cmds: [
    ['HGET {game}:players <pid>', 'Check the player has joined.'],
    ['HGETALL {game}:round', 'Current round number, start time and question index.'],
    ['TIME', 'Valkey\'s clock is the one clock every server shares, so elapsed time is the same whichever server takes the request.'],
    ['EVAL "if server.call(\'HSETNX\', ...) == 0 then return 0 end server.call(\'XADD\', ...)" 2 {game}:round:<n>:answers {game}:events ...', 'One atomic script. HSETNX stores choice and elapsed time only if this player has not answered, then XADD announces the guess. A resent request returns 0 and changes nothing.'],
  ] },
  { id: 'leave', name: 'Leave the game', actors: [P], how: 'POST /api/leave clears the cookie and removes the player in one transaction.', cmds: [
    ['MULTI · HDEL {game}:players <pid> · ZREM {game}:leaderboard <pid> · HLEN {game}:players · EXEC', 'Name and score go together, never one without the other.'],
    ['XADD {game}:events MAXLEN ~ 1000 * type players count <n>', 'Update every screen.'],
  ] },
  { id: 'view', name: 'Follow the live game', actors: [P, H], how: 'GET /api/state on page load and after every reconnect, then server-sent events from whichever server the load balancer picked.', cmds: [
    ['HGETALL {game}:round', 'Which question is running and when it started.'],
    ['LINDEX {questions} <qi>', 'The question and its options.'],
    ['LLEN {questions}', 'How many questions there are.'],
    ['HLEN {game}:players', 'Player count.'],
    ['ZREVRANGE {game}:leaderboard 0 -1 WITHSCORES', 'The ranked board.'],
    ['HMGET {game}:players <pid> ...', 'Names for the board and the guesses.'],
    ['HGET {game}:round:<n>:answers <pid>', 'Your locked-in choice, so a reload keeps it.'],
    ['HGETALL {game}:round:<n>:answers', 'Everyone\'s guesses, only after the 20s reveal.'],
    ['HGET {game}:round:<n>:points <pid>', 'Your points, once the question is over.'],
  ] },
  { id: 'signin', name: 'Sign in as host', actors: [H], how: 'POST /api/host/login. The admin code is checked in the app against the key Fargate injects from Secrets Manager. No Valkey commands, and the QR code stays hidden until it passes.', cmds: [] },
  { id: 'next', name: 'Start the next question', actors: [H], how: 'POST /api/host/next. Only the lock holder gets past the first command, so the round number is set absolutely rather than incremented.', cmds: [
    ['SET {game}:active 1 PX 31000 NX', 'A lock held for the length of a question, so a second click, or a resent request, fails. It expires on its own.'],
    ['LLEN {questions}', 'Total questions.'],
    ['HGET {game}:round n', 'The next number is this plus one. After the last question, DEL {game}:active releases the lock.'],
    ['LINDEX {questions} <qi>', 'The question to send out.'],
    ['TIME', 'The question\'s start time, on the shared clock.'],
    ['HSET {game}:round n <n> start <ms> qi <qi>', 'The current question, as absolute values.'],
    ['XADD {game}:events MAXLEN ~ 1000 * type round ...', 'Every server starts its 20s reveal and 30s end timers off this start time. A duplicate is ignored by round number.'],
  ] },
  { id: 'questions', name: 'List questions and answers', actors: [H], how: 'GET /api/host/questions, admin code required.', cmds: [
    ['LRANGE {questions} 0 -1', 'The whole bank: question, options, answer and points, as JSON per entry.'],
  ] },
  { id: 'reset', name: 'Reset the game', actors: [H], how: 'POST /api/host/reset. Every player, answer and score is removed in one atomic step.', cmds: [
    ['HGET {game}:round n', 'How many questions\' keys to clean up.'],
    ['MULTI · DEL {game}:players {game}:leaderboard {game}:round {game}:active {game}:round:<i>:answers {game}:round:<i>:points ... · XADD {game}:events ... type reset · EXEC', 'One DEL for every key, possible because they share a slot. Servers then cancel pending timers and every phone goes back to the join screen.'],
  ] },
  { id: 'watch', name: 'Watch the command stream', actors: [H], how: 'The host screen and /commands subscribe with ?commands. The gauge counts arrivals per second.', cmds: [
    ['XREVRANGE valkey:commands + - COUNT 100', 'The last 100 commands, so the panel isn\'t empty on connect.'],
    ['XREAD BLOCK 0 COUNT 500 STREAMS valkey:commands <id>', 'Each server tails the stream on its own connection and pushes new entries to its screens.'],
  ] },
  { id: 'seed', name: 'Load the question bank', actors: [S], how: 'On server start. app/questions.json is loaded only when its hash changes.', cmds: [
    ['GET {questions}:version', 'The hash of the file the bank was loaded from.'],
    ['MULTI · DEL {questions} · RPUSH {questions} <json> ... · SET {questions}:version <sha1> · EXEC', 'The {questions} hash tag puts both keys in one slot, so the swap is one atomic transaction.'],
  ] },
  { id: 'fanout', name: 'Fan out game events', actors: [S], how: 'Every server tails {game}:events, so any server can serve any phone and none of them needs sticky sessions.', cmds: [
    ['XREVRANGE {game}:events + - COUNT 1', 'Start after the newest event.'],
    ['XREAD BLOCK 0 STREAMS {game}:events <id>', 'Block on a dedicated connection until the next event, then push it to this server\'s screens.'],
  ] },
  { id: 'reveal', name: 'Reveal guesses at 20s', actors: [S], how: 'A timer on every server, set from the question\'s start time.', cmds: [
    ['HGETALL {game}:round:<n>:answers', 'Everything locked in so far.'],
    ['HMGET {game}:players <pid> ...', 'Names to show beside the guesses.'],
  ] },
  { id: 'score', name: 'Score the question at 30s', actors: [S], how: 'A timer on every server. Points and totals are derived from the answers and written as absolute values, so every server can run it, and run it again, with the same result.', cmds: [
    ['LINDEX {questions} <qi> · HGETALL {game}:round:<n>:answers', 'The correct option, and each player\'s choice and elapsed time.'],
    ['HSET {game}:round:<n>:points <pid> <points> ...', 'This question\'s points: full until 20s, then falling to 0 at 30s.'],
    ['HKEYS {game}:players · HGETALL {game}:round:<i>:points ...', 'Every current player and every question\'s points.'],
    ['ZADD {game}:leaderboard <total> <pid> ...', 'Each total set outright from the sum, never incremented.'],
    ['ZREVRANGE {game}:leaderboard 0 -1 WITHSCORES · HMGET {game}:players ...', 'The top 10, and each player\'s own rank and points.'],
  ] },
  { id: 'monitor', name: 'Record every command', actors: [S], how: 'One server at a time holds a 10s lease and runs MONITOR on the shard primary. If it dies, another takes over within 10s.', cmds: [
    ['SET monitor:leader <id> PX 10000 NX', 'Take the lease if nobody holds it.'],
    ['EVAL "if server.call(\'GET\', KEYS[1]) == ARGV[1] then return server.call(\'PEXPIRE\', KEYS[1], ARGV[2]) end return 0" 1 monitor:leader <id> 10000', 'Renew the lease only if it is still ours, every 3.3s.'],
    ['MONITOR', 'Every command the primary executes, from every client.'],
    ['XADD valkey:commands MAXLEN ~ 5000 * src <client> cmd <name> args <args>', 'Append each one. Commands that touch valkey:commands are skipped, or every entry would log another.'],
  ] },
];

// ---- Command detail per use case ----
const box = document.getElementById('cases');
for (const c of CASES) {
  const card = el('section', 'card case');
  card.id = `uc-${c.id}`;
  card.append(el('h2', null, c.name), el('p', 'who', c.actors.join(', ')), el('p', null, c.how));
  if (c.cmds.length) {
    const table = el('table');
    for (const [cmd, why] of c.cmds) {
      const tr = el('tr');
      const td = el('td');
      td.append(el('code', null, cmd));
      tr.append(td, el('td', null, why));
      table.append(tr);
    }
    card.append(table);
  }
  box.append(card);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
</script>
</body>
</html>
