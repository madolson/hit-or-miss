<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hit or Miss · How it works</title>
<link rel="stylesheet" href="/app.css">
<style>
  main { max-width: 1240px; margin: 0 auto; padding: 1.5em; }
  .topbar { display: flex; align-items: center; gap: .8em; margin-bottom: 1em; }
  .topbar img { height: 2em; }
  .topbar h1 { margin: 0; }
  .cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(560px, 100%), 1fr)); gap: 1em; margin-top: 1.5em; }
  .topbar a { color: #9aa4d1; }
  .arch { display: flex; align-items: stretch; gap: .6em; margin-top: 1.5em; }
  .arch .actors { display: flex; flex-direction: column; gap: .6em; }
  .arch .node { background: #18214a; border: 1px solid #3a4470; border-radius: 12px; padding: .8em 1em; text-align: center; flex: 1; }
  .arch .actors { justify-content: center; }
  .arch .node { display: flex; flex-direction: column; justify-content: center; }
  .arch .actors .node { flex: none; }
  .arch .node strong { display: block; white-space: nowrap; }
  .arch .valkey { border-color: #6983ff; box-shadow: 0 0 18px #6983ff55; flex: 1.4; }
  .arch .arrow { flex: none; display: flex; align-items: center; justify-content: center; }
  .arch .arrow::before { content: '→'; font-size: 1.6em; color: #ccf1ff; }
  @media (max-width: 800px) {
    .arch { flex-direction: column; align-items: stretch; }
    .arch .actors { flex-direction: row; }
    .arch .actors .node { flex: 1; }
    .arch .arrow::before { content: '↓'; }
  }
  @media (max-width: 600px) { main { padding: .8em; } .topbar h1 { font-size: 1.3em; } .case td:first-child { width: 55%; } }
  .case h2 { margin-bottom: .2em; }
  .case .who { color: #9aa4d1; margin: 0 0 .6em; }
  .case table { width: 100%; border-collapse: collapse; font-size: .92em; }
  .case td { padding: .35em .4em; border-top: 1px solid #2a3466; vertical-align: top; }
  .case td:first-child { width: 48%; }
  .case code { font: 12.5px/1.4 ui-monospace, Menlo, monospace; color: #ffcf5c; word-break: break-word; }
  </style>
</head>
<body>
<main>
  <header class="topbar"><img src="/valkey-logo.svg" alt=""><h1>Hit or Miss · How it works</h1><span style="flex:1"></span><a href="https://github.com/madolson/hit-or-miss">Code on GitHub</a></header>
  <div class="arch" aria-label="Architecture">
    <div class="actors">
      <div class="node"><strong>Player</strong></div>
      <div class="node"><strong>Host</strong></div>
    </div>
    <div class="arrow"></div>
    <div class="node"><strong>CloudFront</strong></div>
    <div class="arrow"></div>
    <div class="node"><strong>Load balancer</strong></div>
    <div class="arrow"></div>
    <div class="node"><strong>App servers</strong></div>
    <div class="arrow"></div>
    <div class="node valkey"><strong>Valkey</strong></div>
  </div>
  <div class="cases" id="cases"></div>
</main>
<script>
const P = 'Player', H = 'Host', S = 'App servers';
const CASES = [
  { id: 'join', name: 'Join the game', actors: [P], how: 'POST /api/join. A cookie keeps the player id.', cmds: [
    ['MULTI · HSET {game}:players <pid> <name> · ZADD {game}:leaderboard NX 0 <pid> · HLEN {game}:players · EXEC', 'Add the player at 0 points.'],
    ['XADD {game}:events ... type players pid <pid> name <name>', 'Tell every server.'],
  ] },
  { id: 'answer', name: 'Lock in an answer', actors: [P], how: 'POST /api/answer. First answer wins.', cmds: [
    ['HGETALL {game}:round', 'Current question and start time.'],
    ['TIME', 'Shared clock for elapsed time.'],
    ['EVAL <HSETNX answer, then XADD guess> 2 {game}:round:<n>:answers {game}:events ...', 'Store the answer only if there isn\'t one, and announce it.'],
  ] },
  { id: 'leave', name: 'Leave the game', actors: [P], how: 'POST /api/leave.', cmds: [
    ['MULTI · HDEL {game}:players <pid> · ZREM {game}:leaderboard <pid> · HDEL {game}:reaction-counts <pid> · EXEC', 'Remove the player.'],
    ['XADD {game}:events ... type players pid <pid> left 1', 'Tell every server.'],
  ] },
  { id: 'react', name: 'Send a reaction', actors: [P], how: 'POST /api/react.', cmds: [
    ['MULTI · XADD {game}:reactions ... kind <kind> pid <pid> · HINCRBY {game}:reaction-counts <pid> 1 · EXEC', 'Record the emoji and count it.'],
  ] },
  { id: 'view', name: 'Follow the live game', actors: [P, H], how: 'GET /api/state, then server-sent events.', cmds: [
    ['HGETALL {game}:round · LINDEX {questions} <qi>', 'Current question.'],
    ['ZREVRANGE {game}:leaderboard 0 -1 WITHSCORES', 'Leaderboard.'],
    ['HMGET {game}:players ... · HMGET {game}:reaction-counts ...', 'Names and emoji counts.'],
    ['HGETALL {game}:round:<n>:answers', 'Guesses, after 20 seconds.'],
  ] },
  { id: 'signin', name: 'Sign in as host', actors: [H], how: 'POST /api/host/login. Checked in the app, no Valkey commands.', cmds: [] },
  { id: 'next', name: 'Start the next question', actors: [H], how: 'POST /api/host/next.', cmds: [
    ['SET {game}:active 1 PX 31000 NX', 'Lock for the length of a question.'],
    ['HGET {game}:round n · LINDEX {questions} <qi> · TIME', 'Next question and start time.'],
    ['HSET {game}:round n <n> start <ms> qi <qi>', 'Make it current.'],
    ['XADD {game}:events ... type round', 'Every server starts its timers.'],
  ] },
  { id: 'questions', name: 'List questions and answers', actors: [H], how: 'GET /api/host/questions.', cmds: [
    ['LRANGE {questions} 0 -1', 'The whole question bank.'],
  ] },
  { id: 'reset', name: 'Reset the game', actors: [H], how: 'POST /api/host/reset.', cmds: [
    ['MULTI · DEL {game}:players {game}:leaderboard {game}:round ... · XADD {game}:events ... type reset · EXEC', 'Remove every player and score in one step.'],
  ] },
  { id: 'reactions', name: 'Show reactions', actors: [H], how: 'Polled once a second.', cmds: [
    ['XRANGE {game}:reactions (<last id> + COUNT 200', 'Reactions since the last poll.'],
  ] },
  { id: 'watch', name: 'Watch the command stream', actors: [H], how: 'Host screen and /commands.', cmds: [
    ['XREAD BLOCK 0 STREAMS valkey:commands <id>', 'New commands as they arrive.'],
  ] },
  { id: 'seed', name: 'Load the question bank', actors: [S], how: 'On server start, when questions.json changes.', cmds: [
    ['GET {questions}:version', 'Has the file changed?'],
    ['MULTI · DEL {questions} · RPUSH {questions} ... · SET {questions}:version <sha1> · EXEC', 'Replace the bank.'],
  ] },
  { id: 'fanout', name: 'Fan out game events', actors: [S], how: 'Every server, so any server can serve any phone.', cmds: [
    ['XREAD BLOCK 0 STREAMS {game}:events <id>', 'Wait for the next event.'],
  ] },
  { id: 'reveal', name: 'Reveal guesses at 20s', actors: [S], how: 'Timer on every server.', cmds: [
    ['HGETALL {game}:round:<n>:answers · HMGET {game}:players ...', 'Guesses with names.'],
  ] },
  { id: 'score', name: 'Score the question at 30s', actors: [S], how: 'Timer on every server. Same result on every run.', cmds: [
    ['HGETALL {game}:round:<n>:answers', 'Answers and times.'],
    ['HSET {game}:round:<n>:points <pid> <points> ...', 'Points for this question.'],
    ['ZADD {game}:leaderboard <total> <pid> ...', 'Set each total.'],
  ] },
  { id: 'monitor', name: 'Record every command', actors: [S], how: 'One server holds a lease and runs MONITOR.', cmds: [
    ['SET monitor:leader <id> PX 10000 NX · EVAL <renew if ours>', 'Take or renew the lease.'],
    ['MONITOR', 'Every command Valkey runs.'],
    ['XADD valkey:commands MAXLEN ~ 5000 * ...', 'Save each one.'],
  ] },
];

// ---- Command detail per use case ----
const box = document.getElementById('cases');
for (const c of CASES) {
  const card = el('section', 'card case');
  card.id = `uc-${c.id}`;
  card.append(el('h2', null, c.name), el('p', 'who', c.actors.join(', ')), el('p', null, c.how));
  if (c.cmds.length) {
    const table = el('table');
    for (const [cmd, why] of c.cmds) {
      const tr = el('tr');
      const td = el('td');
      td.append(el('code', null, cmd));
      tr.append(td, el('td', null, why));
      table.append(tr);
    }
    card.append(table);
  }
  box.append(card);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
</script>
</body>
</html>
