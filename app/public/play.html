<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hit or Miss</title>
<link rel="stylesheet" href="/app.css">
<style>
  main { max-width: 560px; margin: 0 auto; padding: 1em; }
  header { display: flex; align-items: center; gap: .6em; margin-bottom: 1em; }
  header img { height: 32px; }
  header .score { margin-left: auto; font-variant-numeric: tabular-nums; }
  #join-form { display: flex; flex-direction: column; gap: .7em; }
  .react { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6em; margin-top: 1em; }
  .react button { background: #18214a; border: 1px solid #3a4470; font-size: 1.8em; padding: .4em 0; line-height: 1; }
  .react button:active { transform: scale(.92); }
  .react img { height: 1em; vertical-align: middle; }
  .links { margin-top: 1.5em; text-align: center; color: #9aa4d1; }
  .links a { color: #9aa4d1; }
</style>
</head>
<body>
<main>
  <header>
    <img src="/valkey-logo.svg" alt="">
    <strong id="me-name">Hit or Miss</strong>
    <span class="score" id="me-score"></span>
    <button id="leave" class="ghost hidden">Leave</button>
  </header>

  <section id="join" class="card hidden">
    <h2>Join the game</h2>
    <form id="join-form">
      <input id="name" maxlength="20" placeholder="Your name" autocomplete="nickname" required>
      <button>Join</button>
    </form>
  </section>

  <section id="wait" class="card hidden">
    <p>30 seconds per question. Answer in the first 20 for full points. In the last 10, everyone's answers show and points drop to zero.</p>
  </section>

  <section id="round" class="hidden">
    <p class="muted" id="worth"></p>
    <h2 id="q"></h2>
    <div class="bar"><div id="bar"></div></div>
    <div class="options" id="options"></div>
    <p id="status" class="muted"></p>
    <p id="explain"></p>
  </section>
  <div class="react hidden" id="react">
    <button data-kind="heart" aria-label="Heart">❤️</button>
    <button data-kind="thumbs" aria-label="Thumbs up">👍</button>
    <button data-kind="rocket" aria-label="Rocket">🚀</button>
    <button data-kind="valkey" aria-label="Valkey"><img src="/valkey-logo.svg" alt=""></button>
  </div>
  <footer class="links"><a href="/how">How it works</a> · <a href="https://github.com/madolson/hit-or-miss">Code</a></footer>
</main>
<script src="/game.js"></script>
<script>
let me = null;
let es = null;

async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  return [res.status, await res.json()];
}

function renderMe() {
  $('me-name').textContent = me ? me.name : 'Hit or Miss';
  $('me-score').textContent = me && me.score != null ? `${me.score} pts${me.rank ? ` · #${me.rank}` : ''}` : '';
  show('leave', !!me);
}

function statusText() {
  if (round.ended) {
    const final = round.final ? ` Final rank #${me.rank}` : '';
    if (round.correct === null) return final.trim();
    if (!round.result?.answered) return 'No answer' + final;
    return (round.result.points ? `+${round.result.points}` : 'Wrong') + final;
  }
  if (round.myChoice !== null) {
    return 'Locked in';
  }
  return '';
}

function render() {
  show('join', !me);
  show('wait', !!me && !round);
  show('round', !!me && !!round);
  show('react', !!me);
  renderMe();
  if (!me || !round) return;
  $('worth').textContent = round.points ? `${round.points} pts` : '';
  $('q').textContent = round.q;
  renderOptions($('options'), round, pick);
  $('status').textContent = statusText();
  $('explain').textContent = round.ended ? round.explain ?? '' : '';
}

async function pick(choice) {
  round.myChoice = choice;
  render();
  const [code, body] = await api('/api/answer', { n: round.n, choice });
  if (code !== 200) $('status').textContent = body.error;
}

async function load() {
  const [, s] = await api('/api/state');
  syncClock(s.serverNow);
  me = s.me;
  round = s.round ? newRound(s.round) : null;
  if (round?.me) round.result = round.me;
  render();
}

function disconnect() {
  es?.close();
  es = null;
  me = round = null;
  render();
}

function connect() {
  es = new EventSource('/events');
  es.onopen = load; // resync after any reconnect
  followRounds(es, render, (d) => {
    round.result = d.me;
    round.final = d.final;
    if (d.me) Object.assign(me, { score: d.me.score, rank: d.me.rank });
  }, disconnect); // the host reset the game, which removes every player
}

$('join-form').onsubmit = async (e) => {
  e.preventDefault();
  const [code, body] = await api('/api/join', { name: $('name').value });
  if (code !== 200) return alert(body.error);
  connect();
};

// Each press is one XADD; a short cooldown keeps one phone from flooding the screen.
let lastReact = 0;
document.querySelectorAll('#react button').forEach((b) => {
  b.onclick = () => {
    if (Date.now() - lastReact < 300) return;
    lastReact = Date.now();
    api('/api/react', { kind: b.dataset.kind });
  };
});

$('leave').onclick = async () => {
  if (!confirm('Leave the game? Your score will be removed.')) return;
  await api('/api/leave', {});
  disconnect();
};

let lastPhase = -1;
(function tick() {
  if (round && me) {
    const p = renderTimer($('bar'), round);
    if (p !== lastPhase) render(); // enable or lock the buttons as phases change
    lastPhase = p;
  }
  requestAnimationFrame(tick);
})();

load().then(() => me && connect());
</script>
</body>
</html>
