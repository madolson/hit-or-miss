<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valkey Race · Commands</title>
<link rel="stylesheet" href="/app.css">
<style>
  body { padding: 1em; height: 100vh; overflow: hidden; }
  .cmds { font-size: 14px; }
  .layout { display: grid; grid-template-columns: 420px 1fr; gap: 1em; align-items: start; }
</style>
</head>
<body>
<div class="layout">
  <div class="card gauge-card" id="gauge"></div>
  <div class="cmds" id="cmds"></div>
</div>
<script src="/game.js"></script>
<script src="/gauge.js"></script>
<script src="/commands.js"></script>
<script>
watchCommands(new EventSource('/events?commands'), $('cmds'), $('gauge'));
</script>
</body>
</html>
